plugins { id 'net.fabricmc.fabric-loom' }
base { archivesName = 'rusty-fabric' }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.2+26.3'
    implementation project(':core')
}
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}
if(project.hasProperty('rustyQa')) {
    sourceSets {
        qa {
            java.srcDir '../qa/src/main/java'
            resources.srcDir '../qa/src/main/resources'
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom.mods {
        rusty { sourceSet sourceSets.main }
        rusty_qa { sourceSet sourceSets.qa }
    }
}
loom {
    runs {
        client {
            client(); runDir 'run'; vmArg '-Drusty.edition=fabric'
            if(project.hasProperty('rustyQa')) {
                source sourceSets.qa
                vmArg "-Drusty.qa=${project.property('rustyQa')}"
                if(project.hasProperty('rustyKeepOpen'))vmArg '-Drusty.qa.keepOpen=true'
                programArgs '--username','RustyQA','--width','1280','--height','720'
                if(project.property('rustyQa')=='singleplayer')programArgs '--quickPlaySingleplayer','RustyLab'
                else programArgs '--quickPlayMultiplayer',project.findProperty('rustyServer') ?: '127.0.0.1:25576'
            }
        }
        server { server(); runDir 'server-run'; programArgs '--nogui' }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar {
    from project(':core').sourceSets.main.output
    from('../../LICENSE')
    from('../../NOTICE')
}
tasks.named('sourcesJar') {
    from project(':core').sourceSets.main.allSource
    from('../../LICENSE')
    from('../../NOTICE')
}
