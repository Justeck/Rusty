# Hook the defining library crate, not horizon-client's public re-export.
# The adapter belongs to horizon-client-render, accessible from both crates.
[[injection]]
id = "minimap-layout-begin"
kind = "HEAD"
target = "horizon_client_lib::extras_hud::draw_minimap"
helper = "minimap-layout-begin.rs"
bindings = [{ name = "batch", ty = "&HudBatch", value = "&*batch" }]

[[injection]]
id = "minimap-layout-end"
kind = "RETURN"
target = "horizon_client_lib::extras_hud::draw_minimap"
helper = "minimap-layout-end.rs"
bindings = [
  { name = "_value", ty = "()", value = "$value" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
]
