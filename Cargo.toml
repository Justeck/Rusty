[package]
name = "rusty-horizon"
version = "1.2.4"
edition = "2024"
license = "Apache-2.0"
publish = false
[[bin]]
name = "rusty-native"
path = "tools/rusty_native.rs"
required-features = ["native-tools"]
[features]
native-tools = ["dep:zip", "dep:sha2", "dep:toml"]
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
sha2 = { version = "0.10.9", optional = true }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"], optional = true }
